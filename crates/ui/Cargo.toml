[package]
name = "crabui"
version = "0.1.0"
edition = "2021"
description = "CrabBoss desktop UI built with Iced"

[dependencies]
crabcore = { path = "../core" }
chrono = { workspace = true }
rfd = "0.15"
# SPIKE: retry the default wgpu renderer now that cpal 0.18 evicted
# windows 0.54 from the graph (gpu-allocator should unify at 0.58).
iced = { version = "0.14", features = ["tokio"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
