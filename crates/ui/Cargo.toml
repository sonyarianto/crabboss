[package]
name = "crabui"
version = "0.1.0"
edition = "2021"
description = "CrabBoss desktop UI built with Iced"

[dependencies]
crabcore = { path = "../core" }
chrono = { workspace = true }
rfd = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
# SPIKE: retry the default wgpu renderer now that cpal 0.18 evicted
# windows 0.54 from the graph (gpu-allocator should unify at 0.58).
# `image`: cover-art display in the Playout strip (decoded once per
# track into a cached handle, never per frame).
iced = { version = "0.14", features = ["tokio", "image"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
