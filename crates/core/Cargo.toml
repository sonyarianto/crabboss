[package]
name = "crabcore"
version = "0.1.0"
edition = "2021"
description = "CrabBoss core engine: audio playback, library management, and scheduling"

[dependencies]
# Workspace deps
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

# Audio (cpal engine: device I/O; symphonia decode; rubato resample)
cpal = "0.18"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
rtrb = "0.3"

# Metadata
lofty = "0.21"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Streaming (Icecast source client, ROADMAP §1.5)
mp3lame-encoder = { workspace = true }
opus = "0.4"
ogg = "0.9"
base64 = { workspace = true }
# TLS for Icecast servers behind HTTPS (port 443): OS-native stack
# (SChannel on Windows), so no OpenSSL setup is needed there.
native-tls = "0.2"

# Async file scanning
walkdir = "2"

# Atomic settings persistence (temp file + platform-correct replace)
tempfile = "3"
