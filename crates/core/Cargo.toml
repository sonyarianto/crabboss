[package]
name = "crabcore"
version = "0.1.0"
edition = "2021"
description = "CrabBoss core engine: audio playback, library management, and scheduling"

[dependencies]
# Workspace deps
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

# Audio (cpal engine: device I/O; symphonia decode; rubato resample)
cpal = "0.18"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
rtrb = "0.3"

# Metadata
lofty = "0.21"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Streaming (Icecast source client, ROADMAP §1.5)
mp3lame-encoder = { workspace = true }
base64 = { workspace = true }

# Async file scanning
walkdir = "2"
